<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a192f"/>

  <!-- Subtle radial highlight (top-left) -->
  <defs>
    <radialGradient id="glow" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Mint accent bar -->
  <rect x="90" y="178" width="64" height="5" fill="#64ffda"/>

  <!-- Name -->
  <text
    x="90"
    y="290"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="92"
    font-weight="800"
    fill="#e6f1ff"
    letter-spacing="-3"
  >Shahzar Ahmed</text>

  <!-- Tagline -->
  <text
    x="90"
    y="360"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="34"
    font-weight="400"
    fill="#8892b0"
  >Mobile engineering · KMP · Android</text>

  <!-- Bottom row: site URL -->
  <text
    x="90"
    y="545"
    font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace"
    font-size="26"
    font-weight="600"
    fill="#64ffda"
  >shahzar.dev</text>

  <!-- Right-side monogram "S" mark (mirrors favicon) -->
  <g transform="translate(990, 215)">
    <rect width="160" height="160" rx="28" fill="#0a192f" stroke="#1e2d4a" stroke-width="2"/>
    <text
      x="80"
      y="80"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
      font-size="108"
      font-weight="800"
      fill="#64ffda"
      text-anchor="middle"
      dominant-baseline="central"
      letter-spacing="-4"
    >S</text>
  </g>
</svg>
